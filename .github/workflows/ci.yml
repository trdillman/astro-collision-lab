name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests (Warp ${{ matrix.warp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - warp: "1.15.0"   # the add-on's pin: full suite
            suite: all
          - warp: "1.18.0"   # astro-unified-sdk's pin: reusable packages only
            suite: packages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "warp-lang==${{ matrix.warp }}"
          python -m pip install -e packages/astro-initial-conditions -e packages/warp-cuda-gl -e packages/pinned-wheel-installer
      - name: Add-on copies match the packages
        run: python tools/sync_packages.py --check
      - name: Lint packages
        run: |
          for p in packages/*/; do (cd "$p" && ruff check .); done
      - name: Test (full suite)
        if: matrix.suite == 'all'
        run: python -m pytest -q
      - name: Test (packages)
        if: matrix.suite == 'packages'
        run: python -m pytest -q packages tests/test_package_sync.py tests/test_device_appearance.py tests/test_cuda_gl.py

  build-packages:
    name: Build package wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          for p in packages/*/; do python -m build --wheel --outdir dist "$p"; done
          ls dist
      - name: Install wheels and import
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import astro_ics, warp_cuda_gl, pinned_wheel; print(astro_ics.__version__, warp_cuda_gl.__version__, pinned_wheel.__version__)"
